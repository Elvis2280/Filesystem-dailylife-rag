[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --cov=app --cov-report=term-missing --cov-fail-under=80

markers =
    unit: Unit tests (isolated, no external services)
    integration: Integration tests (requires Postgres/Redis)
    slow: Slow tests (ML inference, large models, etc.)
