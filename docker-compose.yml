services:
  nginx:
    image: nginx:alpine
    ports:
      - '8080:80'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - frontend
    restart: unless-stopped

  api:
    build: .
    command: >
      sh -c "if [ \"$DEBUGPY\" = \"1\" ]; then
        python -Xfrozen_modules=off -m debugpy --listen 0.0.0.0:5678 -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload;
      else
        uvicorn main:app --host 0.0.0.0 --port 8000 --reload;
      fi"
    expose:
      - '8000'
    ports:
      - '5678:5678'
    env_file:
      - .env
    volumes:
      - .:/app
      - ./brain:/app/brain
      - ./storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - frontend
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    build: .
    command: celery -A workers.celery_app worker --loglevel=info --pool=threads
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - model_cache:/home/appuser/.cache
      - ./storage:/app/storage
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G

  worker-gpu:
    profiles: ['gpu']
    build: .
    command: celery -A workers.celery_app worker --loglevel=info --pool=threads
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - model_cache:/home/appuser/.cache
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 4G

  flower:
    build: .
    command: celery -A workers.celery_app flower --port=5555
    env_file:
      - .env
    depends_on:
      - redis
      - worker
    expose:
      - '5555'
    ports:
      - '5555:5555'
    networks:
      - backend

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ['CMD-SHELL', "bash -c 'cat < /dev/null > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: memoryrag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memoryrag}
      POSTGRES_DB: memoryrag
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U memoryrag']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend
    restart: unless-stopped

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  qdrant_data:
  model_cache:
  postgres_data:
